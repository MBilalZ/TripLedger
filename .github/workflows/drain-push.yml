name: Drain push queue

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke send-push Edge Function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PUSH_DRAIN_SECRET: ${{ secrets.PUSH_DRAIN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${PUSH_DRAIN_SECRET:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or PUSH_DRAIN_SECRET secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/send-push.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/send-push" \
            -H "Authorization: Bearer ${PUSH_DRAIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/send-push.json
          echo
          test "$code" = "200"
