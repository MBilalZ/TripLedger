name: CI

on:
  pull_request:
  push:
    branches: [main, master, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.20.0
          runtime: node@24
          # Avoid concurrent cache-save races (prod+main) and @actions/cache DEP0190 noise.
          cache: false
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test engine
        run: pnpm test:engine
      - name: Test validation
        run: pnpm --filter @tripledger/validation test
      - name: Typecheck web
        run: pnpm --filter @tripledger/web typecheck
      - name: Audit (high+)
        run: pnpm audit --audit-level=high
