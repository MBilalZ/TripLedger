name: CI

on:
  pull_request:
  push:
    branches: [main, master, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test engine
        run: pnpm test:engine
      - name: Test validation
        run: pnpm --filter @tripledger/validation test
      - name: Typecheck web
        run: pnpm --filter @tripledger/web typecheck
      - name: Audit (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true
